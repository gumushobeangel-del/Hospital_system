services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medilink}
      POSTGRES_USER: ${POSTGRES_USER:-medilink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - medilink-postgres:/var/lib/postgresql/data

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-medilink}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-medilink}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  medilink-postgres:
